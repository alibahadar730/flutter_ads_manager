name: flutter_ads_manager
description: "Drop-in AdMob ads for Flutter: banner, interstitial, rewarded, rewarded interstitial and app open ads with auto-reload, retry, and built-in GDPR consent."
version: 0.0.7
homepage: https://github.com/alibahadar730/flutter_ads_manager
repository: https://github.com/alibahadar730/flutter_ads_manager
topics:
  - ads
  - admob
  - monetization
  - advertising
  - consent

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  google_mobile_ads: ^9.1.0
  wakelock_plus: ^1.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

